name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Every job that writes to gh-pages shares this group, so publishes never race.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The API runs inside the browser (ADR 0004): a static build is the whole demo.
      - run: npm run build:demo -w @timbre/app
      - name: Publish the demo at the site root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          keep_files: true
